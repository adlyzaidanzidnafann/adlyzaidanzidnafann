<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accounting Adventure</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #10182f;
        }

        /* ================= HEADER ================= */

        .header {
            height: 60px;
            background: #111b3a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-around;
            position: relative;
            z-index: 100;
        }

        .badge-game {
            background: #243563;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
        }

        /* ================= GAME ================= */

        #game {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            height: calc(100dvh - 60px);
            min-height: 500px;
            overflow: hidden;

            background:
                linear-gradient(
                    to bottom,
                    #63c4f2 0%,
                    #bcecff 70%,
                    #e2f8ff 100%
                );

            touch-action: none;
        }

        /* ================= SUN ================= */

        .sun {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #ffd43b;
            right: 12%;
            top: 10%;
            box-shadow: 0 0 30px rgba(255,212,59,.7);
        }

        /* ================= CLOUD ================= */

        .cloud {
            position: absolute;
            width: 90px;
            height: 30px;
            background: white;
            border-radius: 30px;
            opacity: .85;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud::before {
            width: 40px;
            height: 40px;
            left: 12px;
            top: -18px;
        }

        .cloud::after {
            width: 48px;
            height: 48px;
            right: 8px;
            top: -22px;
        }

        .cloud1 {
            top: 16%;
            left: 10%;
        }

        .cloud2 {
            top: 28%;
            left: 58%;
        }
