<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adly Adventure</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game {
            width: 100%;
            max-width: 900px;
            height: 65vh;
            min-height: 400px;
            display: block;
            background: #79d7ff;
            border: 4px solid white;
            border-radius: 12px;
        }

        #info {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            color: white;
            padding: 8px 12px;
            font-size: 18px;
            font-weight: bold;
        }

        #controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
        }

        .control-group {
            display: flex;
            gap: 12px;
        }

        .game-btn {
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,.4);
            touch-action: none;
        }

        .game-btn:active {
            transform: scale(.9);
        }

        #restart {
            position: absolute;
            display: none;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #ffcc00;
            font-weight: bold;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            #game {
                height: 55vh;
                min-height: 350px;
                border-radius: 0;
                border-left: none;
                border-right: none;
            }

            #info {
                font-size: 15px;
            }

            .game-btn {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

<div id="gameContainer">

    <div id="info">
        <span>⭐ Skor: <span id="score">0</span></span>
        <span>❤️ Nyawa: <span id="lives">3</span></span>
    </div>

    <canvas id="game"></canvas>

    <button id="restart" onclick="restartGame()">
        🔄 Main Lagi
    </button>

    <div id="controls">

        <div class="control-group">
            <button class="game-btn" id="left">◀</button>
            <button class="game-btn" id="right">▶</button>
        </div>

        <button class="game-btn" id="jump">
            ▲
        </button>

    </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);


// ================= GAME =================

let score = 0;
let lives = 3;
let gameOver = false;

const keys = {
    left: false,
    right: false,
    jump: false
};


// ================= PLAYER =================

const player = {
    x: 80,
    y: 100,
    width: 32,
    height: 42,
    velocityX: 0,
    velocityY: 0,
    speed: 5,
    jumpPower: 12,
    grounded: false
};


// ================= PLATFORM =================

let platforms = [];

function createPlatforms() {

    platforms = [

        {
            x: 0,
            y: canvas.height - 50,
            width: canvas.width,
            height: 50

        {
            x: 180,
            y: canvas.height - 140,
            width: 130,
            height: 20
        },

        {
            x: 400,
            y: canvas.height - 220,
            width: 140,
            height: 20
        },

        {
            x: 650,
            y: canvas.height - 150,
            width: 140,
            height: 20
        }
    ];
}

createPlatforms();


// ================= COINS =================

let coins = [
    {x: 220, y: canvas.height - 180, collected: false},
    {x: 440, y: canvas.height - 260, collected: false},
    {x: 700, y: canvas.height - 190, collected: false}
];


// ================= ENEMY =================

const enemy = {
    x: 500,
    y: canvas.height - 90,
    width: 35,
    height: 35,
    speed: 2,
    direction: 1
};


// ================= CONTROLS =================

function pressButton(button, key) {

    button.addEventListener("touchstart", function(e) {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", function(e) {
        e.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("mousedown", function() {
        keys[key] = true;
    });

    button.addEventListener("mouseup", function() {
        keys[key] = false;
    });

    button.addEventListener("mouseleave", function() {
        keys[key] = false;
    });
}

pressButton(document.getElementById("left"), "left");
pressButton(document.getElementById("right"), "right");
pressButton(document.getElementById("jump"), "jump");


// ================= KEYBOARD =================

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key === "a") {
        keys.left = true;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        keys.right = true;
    }

    if (
        e.key === "ArrowUp" ||
        e.key === "w" ||
        e.key === " "
    ) {
        keys.jump = true;
    }

});
