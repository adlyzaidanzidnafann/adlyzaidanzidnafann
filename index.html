<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Adly Zaidan Zidna Fann</title>

</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">

                <div class="card shadow border-0 rounded-4">

                    <div class="card-body text-center p-4">

                        <!-- Foto -->
                        <div class="mb-3">
                            <div 
                                class="bg-primary text-white rounded-circle mx-auto d-flex align-items-center justify-content-center"
                                style="width: 100px; height: 100px; font-size: 40px;"
                            >
                                A
                            </div>
                        </div>

                        <!-- Nama -->
                        <h2 class="fw-bold mb-1">
                            Adly Zaidan Zidna Fann
                        </h2>

                        <p class="text-muted mb-4">
                            Mahasiswa
                        </p>

                        <!-- Biodata -->
                        <div class="text-start">

                            <div class="mb-3">
                                <small class="text-muted">Nama Lengkap</small>
                                <div class="fw-semibold">

                            </div>

                            <div class="mb-3">

                                    Komputerisasi Akuntansi

                            </div>

                            <div class="mb-3">
                                <small class="text-muted">Semester</small>
                                <div class="fw-semibold">
                                    Semester 1
                                </div>
                            </div>

                            <div class="mb-3">
                                <small class="text-muted">Fakultas</small>
                                <div class="fw-semibold">
                                    Fakultas Komputer
                                </div>
                            </div>

                        </div>

                        <!-- Tombol -->
                        <button class="btn btn-primary w-100 rounded-pill mt-3">
                            Tentang Saya
                        </button>

                    </div>
                </div>

                <!-- Footer -->
                <p class="text-center text-muted mt-4 small">
                    © 2026 Adly Zaidan Zidna Fann
                </p>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
