<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Accounting Adventure</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  touch-action: none;
  background: #87ceeb;
}

#game {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: linear-gradient(#65c7ff, #dff6ff);
}

/* HEADER */
#header {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 58px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  z-index: 100;
  box-shadow: 0 2px 5px #777;
}

#title {
  font-weight: bold;
  color: #222;
}

#info {
  font-weight: bold;
}

/* MATAHARI */
.sun {
  position: absolute;
  top: 80px;
  right: 30px;
  font-size: 55px;
}

/* AWAN */
.cloud {
  position: absolute;
  font-size: 55px;
  opacity: .8;
}

.cloud1 {
  top: 100px;
  left: 40px;
}

.cloud2 {
  top: 180px;
  right: 100px;
}

/* PLAYER */
#player {
  position: absolute;
  width: 50px;
  height: 55px;
  left: 40px;
  bottom: 105px;
  background: #e53935;
  border-radius: 12px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

/* PLATFORM */
.platform {
  position: absolute;
  height: 18px;
  background: #795548;
  border: 4px solid #4e342e;
  border-radius: 8px;
  z-index: 20;
}

.p1 {
  left: 25%;
  bottom: 220px;
  width: 130px;
}

.p2 {
  left: 55%;
  bottom: 320px;
  width: 130px;
}

.p3 {
  left: 78%;
  bottom: 220px;
  width: 120px;
}

/* COIN */
.coin {
  position: absolute;
  font-size: 35px;
  z-index: 25;
  animation: spin 1s infinite linear;
}

.c1 {
  left: 28%;
  bottom: 255px;
}

.c2 {
  left: 58%;
  bottom: 355px;
}

.c3 {
  left: 81%;
  bottom: 255px;
}

@keyframes spin {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

/* FINISH */
#finish {
  position: absolute;
  right: 15px;
  bottom: 105px;
  font-size: 50px;
  z-index: 30;
}

/* TANAH */
#ground {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 95px;
  background: #65a30d;
  border-top: 12px solid #3f6212;
  z-index: 15;
}

/* KONTROL */
#controls {
  position: absolute;
  bottom: 15px;
  left: 0;
  width: 100%;
  height: 80px;
  z-index: 200;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 15px;

  pointer-events: none;
}

.control-group {
  display: flex;
  gap: 12px;
  pointer-events: auto;
}

button {
  width: 70px;
  height: 70px;

  border: 3px solid #222;
  border-radius: 18px;

  background: white;
  color: #111;

  font-size: 30px;
  font-weight: bold;

  box-shadow: 0 5px 0 #555;

  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

button:active {
  transform: translateY(5px);
  box-shadow: 0 0 0 #555;
  background: #ddd;
}

/* PESAN */
#message {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;

  background: rgba(0,0,0,.75);
  color: white;
  padding: 8px 15px;
  border-radius: 20px;

  font-size: 13px;
  text-align: center;
}
</style>
</head>

<body>

<div id="game">

  <div id="header">
    <div id="title">📚 Accounting Adventure</div>
    <div id="info">
      ⭐ <span id="score">0</span>
      ❤️ <span id="lives">3</span>
    </div>
  </div>

  <div class="sun">☀️</div>

  <div class="cloud cloud1">☁️</div>
  <div class="cloud cloud2">☁️</div>

  <div id="message">
    Gunakan tombol untuk bergerak!
  </div>

  <div id="player">🧑‍💼</div>

  <div class="platform p1"></div>
  <div class="platform p2"></div>
  <div class="platform p3"></div>

  <div class="coin c1">🪙</div>
  <div class="coin c2">🪙</div>
  <div class="coin c3">🪙</div>

  <div id="finish">🏁</div>

  <div id="ground"></div>

  <!-- KONTROL HP -->
  <div id="controls">

    <div class="control-group">
      <button id="leftBtn" type="button">◀</button>
      <button id="rightBtn" type="button">▶</button>
    </div>

    <button id="jumpBtn" type="button">⬆</button>

  </div>

</div>


<script>

const player = document.getElementById("player");

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const jumpBtn = document.getElementById("jumpBtn");

const scoreText = document.getElementById("score");
const livesText = document.getElementById("lives");

let x = 40;
let y = 105;

let score = 0;
let lives = 3;

let jumping = false;


/* =========================
   GERAK
========================= */

function moveLeft() {
  x -= 25;

  if (x < 0) {
    x = 0;
  }

  updatePlayer();
}

function moveRight() {
  x += 25;

  const maxX = window.innerWidth - 60;

  if (x > maxX) {
    x = maxX;
  }

  updatePlayer();

  checkCoin();
  checkFinish();
}

function updatePlayer() {
  player.style.left = x + "px";
}


/* =========================
   LOMPAT
========================= */

function jump() {

  if (jumping) return;

  jumping = true;

  let start = y;

  let jumpHeight = 140;

  let startTime = Date.now();

  function animateJump() {

    let elapsed = Date.now() - startTime;

    let progress = elapsed / 500;

    if (progress >= 1) {

      y = start;

      player.style.bottom = y + "px";

      jumping = false;

      return;
    }

    y = start + Math.sin(progress * Math.PI) * jumpHeight;

    player.style.bottom = y + "px";

    requestAnimationFrame(animateJump);
  }

  animateJump();
}


/* =========================
   KOIN
========================= */

function checkCoin() {

  const coins = document.querySelectorAll(".coin");

  coins.forEach(function(coin) {

    if (coin.style.display === "none") return;

    const coinX = coin.getBoundingClientRect().left;

    const playerX = player.getBoundingClientRect().left;

    if (Math.abs(coinX - playerX) < 45) {

      coin.style.display = "none";

      score += 10;

      scoreText.textContent = score;
    }

  });

}


/* =========================
   FINISH
========================= */

function checkFinish() {

  const finishX =
    document.getElementById("finish").getBoundingClientRect().left;

  const playerX =
    player.getBoundingClientRect().left;

  if (Math.abs(finishX - playerX) < 50) {

    accountingQuestion();

  }

}


/* =========================
   SOAL AKUNTANSI
========================= */

function accountingQuestion() {

  const questions = [

    {
      q: "Kas termasuk ke dalam...",
      a: ["A. Aset", "B. Beban", "C. Modal"],
      correct: "A"
    },

    {
      q: "Jika pemilik menyetor uang ke perusahaan, maka...",
      a: ["A. Beban bertambah", "B. Modal bertambah", "C. Utang berkurang"],
      correct: "B"
    },

    {
      q: "Persamaan dasar akuntansi adalah...",
      a: [
        "A. Aset = Utang + Modal",
        "B. Aset = Pendapatan - Beban",
        "C. Modal = Aset + Beban"
      ],
      correct: "A"
    },

    {
      q: "Pendapatan Rp500.000 dan beban Rp300.000. Laba adalah...",
      a: ["A. Rp200.000", "B. Rp800.000", "C. Rp300.000"],
      correct: "A"
    },

    {
      q: "Pembayaran listrik perusahaan termasuk...",
      a: ["A. Aset", "B. Modal", "C. Beban"],
      correct: "C"
    }

  ];

  const q =
    questions[Math.floor(Math.random() * questions.length)];

  let answer =
    prompt(
      q.q +
      "\n\n" +
      q.a.join("\n") +
      "\n\nKetik A, B, atau C:"
    );

  if (!answer) return;

  answer = answer.toUpperCase().trim();

  if (answer === q.correct) {

    score += 50;

    scoreText.textContent = score;

    alert("🎉 BENAR!\n+50 poin");

  } else {

    lives--;

    livesText.textContent = lives;

    alert(
      "❌ Jawaban belum tepat.\n" +
      "Jawaban yang benar: " +
      q.correct
    );

    if (lives <= 0) {

      alert("Game Over!");

      location.reload();

    }

  }

}


/* =========================
   TOMBOL HP
========================= */

function addButton(button, action) {

  /* Pointer Event */
  button.addEventListener("pointerdown", function(e) {

    e.preventDefault();

    action();

  });

  /* Touch Event cadangan */
  button.addEventListener("touchstart", function(e) {

    e.preventDefault();

    action();

  }, { passive: false });

  /* Click cadangan */
  button.addEventListener("click", function(e) {

    e.preventDefault();

    action();

  });

}


addButton(leftBtn, moveLeft);
addButton(rightBtn, moveRight);
addButton(jumpBtn, jump);


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowLeft") {
    moveLeft();
  }

  if (e.key === "ArrowRight") {
    moveRight();
  }

  if (e.key === "ArrowUp" || e.key === " ") {
    jump();
  }

});


/* =========================
   CEGAH ZOOM / SCROLL
========================= */

document.addEventListener("touchmove", function(e) {

  e.preventDefault();

}, { passive: false });


</script>

</body>
</html>
