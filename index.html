<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Accounting Jump Adventure</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
    user-select: none;
}

body {
    background: #87ceeb;
}


/* =========================
   GAME
========================= */

#game {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background:
    linear-gradient(
        #4fc3f7 0%,
        #dff7ff 65%,
        #8bc34a 65%,
        #8bc34a 100%
    );
}


/* =========================
   HEADER
========================= */

#header {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 58px;

    background: white;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    z-index: 100;

    box-shadow: 0 2px 7px rgba(0,0,0,.25);
}

#title {
    font-size: 15px;
    font-weight: bold;
}

#status {
    font-size: 14px;
    font-weight: bold;
}


/* =========================
   MATERI MINI
========================= */

#lesson {

    position: absolute;

    top: 70px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,.9);

    padding: 7px 12px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    z-index: 80;

    text-align: center;
}


/* =========================
   MATAHARI
========================= */

.sun {

    position: absolute;

    top: 90px;
    right: 25px;

    font-size: 55px;
}


/* =========================
   AWAN
========================= */

.cloud {

    position: absolute;

    font-size: 50px;

    opacity: .8;
}

.cloud1 {
    top: 110px;
    left: 30px;
}

.cloud2 {
    top: 190px;
    right: 100px;
}


/* =========================
   PLAYER
========================= */

#player {

    position: absolute;

    width: 52px;
    height: 58px;

    left: 40px;
    bottom: 90px;

    background: #e53935;

    border: 3px solid #8e1b1b;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;

    z-index: 50;

    will-change: left, bottom;
}


/* =========================
   PLATFORM
========================= */

.platform {

    position: absolute;

    height: 18px;

    background: #795548;

    border: 4px solid #4e342e;

    border-radius: 8px;

    z-index: 20;
}

.platform1 {

    left: 20%;
    bottom: 190px;

    width: 130px;
}

.platform2 {

    left: 50%;
    bottom: 285px;

    width: 130px;
}

.platform3 {

    left: 78%;
    bottom: 190px;

    width: 120px;
}


/* =========================
   KOIN
========================= */

.coin {

    position: absolute;

    font-size: 34px;

    z-index: 30;

    animation:
    coinSpin 1s linear infinite;
}

.coin1 {
    left: 25%;
    bottom: 225px;
}

.coin2 {
    left: 53%;
    bottom: 320px;
}

.coin3 {
    left: 81%;
    bottom: 225px;
}

@keyframes coinSpin {

    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(360deg);
    }

}


/* =========================
   PAPAN SOAL
========================= */

.questionMarker {

    position: absolute;

    font-size: 42px;

    z-index: 40;
}

.marker1 {

    left: 40%;
    bottom: 90px;
}

.marker2 {

    left: 67%;
    bottom: 90px;
}


/* =========================
   FINISH
========================= */

#finish {

    position: absolute;

    right: 15px;
    bottom: 90px;

    font-size: 50px;

    z-index: 40;
}


/* =========================
   TANAH
========================= */

#ground {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 75px;

    background: #66a61e;

    border-top: 10px solid #477515;

    z-index: 25;
}


/* =========================
   KONTROL
========================= */

#controls {

    position: absolute;

    left: 0;
    bottom: 5px;

    width: 100%;

    display: flex;

    justify-content: space-between;

    padding: 0 15px;

    z-index: 200;

    pointer-events: none;
}

.control-group {
    display: flex;
    gap: 10px;
}

.control {

    width: 62px;
    height: 62px;

    border: 3px solid #222;

    border-radius: 17px;

    background: white;

    font-size: 27px;

    font-weight: bold;

    box-shadow: 0 4px 0 #555;

    pointer-events: auto;

    touch-action: none;
}

.control:active {

    transform: translateY(4px);

    box-shadow: none;

    background: #ddd;
}


/* =========================
   TOMBOL LOMPAT
========================= */

#jumpBtn {

    width: 85px;

    font-size: 15px;
}


/* =========================
   SOAL
========================= */

#questionBox {

    display: none;

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 92%;
    max-width: 430px;

    background: white;

    padding: 20px;

    border-radius: 20px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.4);

    z-index: 500;

    text-align: center;
}

#questionBox h2 {

    margin-top: 0;

    color: #1565c0;
}

#question {

    font-weight: bold;

    line-height: 1.5;
}

.answer {

    display: block;

    width: 100%;

    padding: 13px;

    margin: 9px 0;

    border: 2px solid #ddd;

    border-radius: 12px;

    background: #f5f5f5;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

.answer:active {

    background: #ddd;
}


/* =========================
   HASIL
========================= */

#resultBox {

    display: none;

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    background: white;

    padding: 25px;

    border-radius: 20px;

    text-align: center;

    z-index: 600;

    box-shadow: 0 10px 30px rgba(0,0,0,.4);
}

#restartBtn {

    padding: 13px 25px;

    border: none;

    border-radius: 12px;

    background: #1976d2;

    color: white;

    font-weight: bold;

    font-size: 16px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    #title {
        font-size: 13px;
    }

    #lesson {
        font-size: 10px;
        max-width: 75%;
    }

    .control {
        width: 60px;
        height: 60px;
    }

}

</style>
</head>


<body>


<div id="game">


    <!-- HEADER -->

    <div id="header">

        <div id="title">
            📚 Accounting Jump
        </div>

        <div id="status">

            ⭐ <span id="score">0</span>

            &nbsp;

            ❤️ <span id="lives">3</span>

        </div>

    </div>


    <!-- MATERI -->

    <div id="lesson">
        📖 Aset • Utang • Modal • Pendapatan • Beban • Laba
    </div>


    <!-- LANGIT -->

    <div class="sun">
        ☀️
    </div>

    <div class="cloud cloud1">
        ☁️
    </div>

    <div class="cloud cloud2">
        ☁️
    </div>


    <!-- PLATFORM -->

    <div class="platform platform1"></div>

    <div class="platform platform2"></div>

    <div class="platform platform3"></div>


    <!-- KOIN -->

    <div class="coin coin1">
        🪙
    </div>

    <div class="coin coin2">
        🪙
    </div>

    <div class="coin coin3">
        🪙
    </div>


    <!-- PENANDA SOAL -->

    <div
        class="questionMarker marker1">
        ❓
    </div>
