<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Accounting Adventure</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:#75ccef;
}


/* =========================
   GAME
========================= */

#game{
    position:relative;
    width:100%;
    height:100dvh;
    overflow:hidden;

    background:
    linear-gradient(
        #55c7f2 0%,
        #c8f0ff 65%,
        #83c441 65%,
        #83c441 100%
    );

    touch-action:none;
}


/* =========================
   HEADER
========================= */

#header{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:52px;

    background:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    z-index:1000;

    box-shadow:0 2px 5px rgba(0,0,0,.25);
}

#title{
    font-size:13px;
    font-weight:bold;
}

#status{
    font-size:13px;
    font-weight:bold;
}


/* =========================
   LANGIT
========================= */

.sun{
    position:absolute;
    top:70px;
    right:20px;
    font-size:50px;
}

.cloud{
    position:absolute;
    font-size:45px;
    opacity:.85;
}

.cloud1{
    top:90px;
    left:20px;
}

.cloud2{
    top:160px;
    right:80px;
}


/* =========================
   MATERI
========================= */

#lesson{
    position:absolute;

    top:65px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(255,255,255,.9);

    padding:6px 10px;

    border-radius:20px;

    font-size:10px;
    font-weight:bold;

    z-index:100;
    white-space:nowrap;
}


/* =========================
   PLAYER
========================= */

#player{
    position:absolute;

    width:48px;
    height:54px;

    left:30px;
    bottom:90px;

    background:#e53935;

    border:3px solid #8e1b1b;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;

    z-index:500;

    will-change:left,bottom;
}


/* =========================
   TANAH
========================= */

#ground{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:75px;

    background:#70ad28;

    border-top:9px solid #4c7818;

    z-index:300;
}


/* =========================
   PLATFORM
========================= */

.platform{
    position:absolute;

    height:16px;

    background:#795548;

    border:3px solid #4e342e;

    border-radius:8px;

    z-index:350;
}

.platform1{
    left:20%;
    bottom:170px;
    width:110px;
}

.platform2{
    left:50%;
    bottom:260px;
    width:110px;
}

.platform3{
    left:78%;
    bottom:170px;
    width:105px;
}


/* =========================
   KOIN
========================= */

.coin{
    position:absolute;

    font-size:30px;

    z-index:450;

    animation:spin 1s linear infinite;
}

.coin1{
    left:25%;
    bottom:205px;
}

.coin2{
    left:53%;
    bottom:300px;
}

.coin3{
    left:80%;
    bottom:205px;
}

@keyframes spin{

    from{
        transform:rotateY(0);
    }

    to{
        transform:rotateY(360deg);
    }

}


/* =========================
   TANDA SOAL
========================= */

.question{
    position:absolute;

    font-size:35px;

    z-index:450;
}

.q1{
    left:40%;
    bottom:85px;
}

.q2{
    left:65%;
    bottom:85px;
}


/* =========================
   FINISH
========================= */

#finish{
    position:absolute;

    right:12px;
    bottom:85px;

    font-size:45px;

    z-index:450;
}


/* =========================
   KONTROL HP
========================= */

#controls{
    position:absolute;

    left:0;
    bottom:8px;

    width:100%;

    height:70px;

    padding:0 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:2000;

    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:10px;

    pointer-events:auto;
}

.control{
    width:62px;
    height:62px;

    border:3px solid #222;

    border-radius:16px;

    background:#ffffff;

    color:#111;

    font-size:26px;
    font-weight:bold;

    box-shadow:0 4px 0 #555;

    pointer-events:auto;

    touch-action:none;

    user-select:none;
}

.control:active{
    transform:translateY(4px);
    box-shadow:none;
    background:#ddd;
}

#jumpBtn{
    width:90px;
    font-size:14px;
}


/* =========================
   SOAL
========================= */

#questionBox{
    display:none;

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:90%;
    max-width:400px;

    background:white;

    padding:20px
